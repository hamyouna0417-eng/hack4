<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>META-KILLER | 2022 개정 교육과정 메타인지 오답 노트 & 킬러 변형 퀴즈</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            night: {
              950: '#070a12',
              900: '#0b0f19',
              800: '#111827',
              700: '#1e293b',
              600: '#334155'
            }
          }
        }
      }
    };
  </script>

  <!-- KaTeX CSS & JS (수학/과학 LaTeX 수식 렌더링) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="dark-mode min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <!-- 앱 데이터, 수식 렌더러, 변형 생성 엔진, 상태 스토어 모듈 -->
  <script src="js/curriculumData.js"></script>
  <script src="js/mathRenderer.js"></script>
  <script src="js/variantEngine.js"></script>
  <script src="js/store.js"></script>

  <!-- 메인 React 애플리케이션 -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ---------------------------------------------------------
    // 공통 컴포넌트: KaTeX 수식 텍스트 렌더러
    // ---------------------------------------------------------
    function MathText({ text, className = "" }) {
      const html = useMemo(() => {
        return window.META_KILLER_MATH.renderMathInText(text || "");
      }, [text]);

      return (
        <div
          className={`math-render-container ${className}`}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }

    // ---------------------------------------------------------
    // 공통 컴포넌트: 과목별 아이콘 SVG
    // ---------------------------------------------------------
    function CategoryIcon({ iconName, className = "w-5 h-5" }) {
      switch (iconName) {
        case "BookOpen":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
          );
        case "Sigma":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M18 4H6l6 8-6 8h12" />
            </svg>
          );
        case "Languages":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" />
            </svg>
          );
        case "Globe":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
            </svg>
          );
        case "Atom":
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <circle cx="12" cy="12" r="2" />
              <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(30 12 12)" />
              <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(150 12 12)" />
            </svg>
          );
        default:
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
            </svg>
          );
      }
    }

    // ---------------------------------------------------------
    // 메인 앱 컴포넌트
    // ---------------------------------------------------------
    function App() {
      const {
        SUBJECT_CATEGORIES,
        METACOGNITION_TAGS,
        DIFFICULTY_OPTIONS,
        EBBINGHAUS_STAGES,
        LATEX_SNIPPETS
      } = window.META_KILLER_DATA;

      function getLocalTodayStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      // 전역 상태
      const [problems, setProblems] = useState(() => window.META_KILLER_STORE.loadProblems());
      const [customFolders, setCustomFolders] = useState(() => window.META_KILLER_STORE.loadCustomFolders());
      const [schedules, setSchedules] = useState(() => window.META_KILLER_STORE.loadSchedules());
      const [settings, setSettings] = useState(() => window.META_KILLER_STORE.loadSettings());

      // 현재 메인 뷰: 'dashboard' | 'calendar' | 'community' | 'register' | 'blindQuiz'
      const [activeView, setActiveView] = useState("dashboard");

      // 달력 및 일정 관리 상태
      const [calendarYear, setCalendarYear] = useState(() => new Date().getFullYear());
      const [calendarMonth, setCalendarMonth] = useState(() => new Date().getMonth());
      const [selectedDate, setSelectedDate] = useState(() => getLocalTodayStr());
      const [scheduleTitle, setScheduleTitle] = useState("");
      const [scheduleTime, setScheduleTime] = useState("");
      const [scheduleCategory, setScheduleCategory] = useState("study");
      const [scheduleMemo, setScheduleMemo] = useState("");
      const [editingScheduleId, setEditingScheduleId] = useState(null);

      // 사용자 인증 및 로그인 상태
      const [currentUser, setCurrentUser] = useState(() => window.META_KILLER_STORE.loadCurrentUser());
      const [users, setUsers] = useState(() => window.META_KILLER_STORE.loadUsers());
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState("login"); // 'login' | 'signup'
      const [authId, setAuthId] = useState("");
      const [authPw, setAuthPw] = useState("");
      const [signupName, setSignupName] = useState("");
      const [signupGrade, setSignupGrade] = useState("고3 이과");
      const [signupAvatar, setSignupAvatar] = useState("👨‍🎓");
      const [showUserProfileModal, setShowUserProfileModal] = useState(false);
      const [showDeleteAccountConfirm, setShowDeleteAccountConfirm] = useState(false);
      const [deleteAccountWithData, setDeleteAccountWithData] = useState(true);

      // 사용자 문제 모음집 뷰 전용 필터 및 보기 모드 상태
      const [commDisplayMode, setCommDisplayMode] = useState("grid"); // 'grid' | 'exam' | 'test'
      const [commAuthorFilter, setCommAuthorFilter] = useState("all");
      const [commSortBy, setCommSortBy] = useState("latest");
      const [commOnlyBookmarked, setCommOnlyBookmarked] = useState(false);
      const [hideAnswersInExam, setHideAnswersInExam] = useState(true);
      const [examColumns, setExamColumns] = useState(2);
      const [testIndex, setTestIndex] = useState(0);
      const [testUserAnswers, setTestUserAnswers] = useState({});
      const [testSubmittedMap, setTestSubmittedMap] = useState({});
      const [testFinished, setTestFinished] = useState(false);
      const [testElapsedSec, setTestElapsedSec] = useState(0);

      // 과목 카테고리 및 세부 과목 필터 상태
      const [selectedCategoryId, setSelectedCategoryId] = useState("all");
      const [selectedSubSubject, setSelectedSubSubject] = useState("all");
      const [selectedErrorTagFilter, setSelectedErrorTagFilter] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");

      // 커스텀 폴더 관리 모달/인라인 상태 ('기타 영역' 확장 기능)
      const [newFolderName, setNewFolderName] = useState("");
      const [newFolderDesc, setNewFolderDesc] = useState("");
      const [editingFolderId, setEditingFolderId] = useState(null);
      const [editingFolderName, setEditingFolderName] = useState("");

      // 상세 보기 / 변형 추가 모달용 선택된 오답 노트 ID
      const [detailProblemId, setDetailProblemId] = useState(null);
      const [isGeneratingVariant, setIsGeneratingVariant] = useState(false);
      const [selectedGenDifficulty, setSelectedGenDifficulty] = useState("similar");

      // Step 4: 블라인드 재도전 퀴즈 상태
      const [quizProblemId, setQuizProblemId] = useState(null);
      const [quizVariantId, setQuizVariantId] = useState(null);
      const [quizUserAnswer, setQuizUserAnswer] = useState("");
      const [quizSubmitted, setQuizSubmitted] = useState(false);
      const [quizResult, setQuizResult] = useState(null);
      const [quizShowTrapHint, setQuizShowTrapHint] = useState(false);
      const [quizElapsedSec, setQuizElapsedSec] = useState(0);
      // 3. [정답 및 변형 포인트 해설] 토글 열림/닫힘 상태 관리
      const [openExplanationMap, setOpenExplanationMap] = useState({});

      function toggleExplanationOpen(variantId) {
        setOpenExplanationMap((prev) => ({
          ...prev,
          [variantId]: !prev[variantId]
        }));
      }

      // 설정 모달 및 토스트 알림
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      // Step 1 ~ Step 3 오답 등록 위저드 상태
      const [wizardStep, setWizardStep] = useState(1);
      const [formCategory, setFormCategory] = useState("math");
      const [formSubSubject, setFormSubSubject] = useState("미적분Ⅰ·Ⅱ");
      const [formUnitTitle, setFormUnitTitle] = useState("");
      const [formQuestionType, setFormQuestionType] = useState("multiple");
      const [formOriginalQuestion, setFormOriginalQuestion] = useState("");
      const [formChoices, setFormChoices] = useState([
        "① ",
        "② ",
        "③ ",
        "④ ",
        "⑤ "
      ]);
      const [formMyWrongAnswer, setFormMyWrongAnswer] = useState("① ");
      const [formActualAnswer, setFormActualAnswer] = useState("③ ");
      const [formOriginalExplanation, setFormOriginalExplanation] = useState("");
      const [formImageDataUrl, setFormImageDataUrl] = useState("");
      const [formErrorTags, setFormErrorTags] = useState(["condition_miss"]);
      const [formTrapMemo, setFormTrapMemo] = useState("");
      const [formDifficulty, setFormDifficulty] = useState("similar");
      const [formGeneratedVariants, setFormGeneratedVariants] = useState([]);
      const [formInlineNewFolder, setFormInlineNewFolder] = useState("");

      // 다크모드 및 독서실 눈 보호 필터 동기화
      useEffect(() => {
        const body = document.body;
        const html = document.documentElement;
        if (settings.darkMode) {
          body.classList.add("dark-mode");
          body.classList.remove("light-mode");
          html.classList.add("dark");
        } else {
          body.classList.add("light-mode");
          body.classList.remove("dark-mode");
          html.classList.remove("dark");
        }

        if (settings.eyeCareFilter) {
          body.classList.add("eye-care-filter");
        } else {
          body.classList.remove("eye-care-filter");
        }
        window.META_KILLER_STORE.saveSettings(settings);
      }, [settings]);

      // 문제, 커스텀 폴더 및 달력 일정 자동 저장
      useEffect(() => {
        window.META_KILLER_STORE.saveProblems(problems);
      }, [problems]);

      useEffect(() => {
        window.META_KILLER_STORE.saveCustomFolders(customFolders);
      }, [customFolders]);

      useEffect(() => {
        window.META_KILLER_STORE.saveSchedules(schedules);
      }, [schedules]);

      // 블라인드 퀴즈 스톱워치 타이머
      useEffect(() => {
        if (activeView !== "blindQuiz" || quizSubmitted) return;
        const timer = setInterval(() => {
          setQuizElapsedSec((prev) => prev + 1);
        }, 1000);
        return () => clearInterval(timer);
      }, [activeView, quizSubmitted, quizVariantId]);

      // 연속 모의고사 풀기 모드 타이머
      useEffect(() => {
        if (activeView !== "community" || commDisplayMode !== "test" || testFinished) return;
        const timer = setInterval(() => {
          setTestElapsedSec((prev) => prev + 1);
        }, 1000);
        return () => clearInterval(timer);
      }, [activeView, commDisplayMode, testFinished]);

      function showToast(msg) {
        setToastMessage(msg);
        setTimeout(() => {
          setToastMessage((prev) => (prev === msg ? null : prev));
        }, 3200);
      }

      // 기타 영역의 세부 과목 리스트 (기본 과목 + 사용자 정의 커스텀 폴더 병합)
      const categoriesWithCustom = useMemo(() => {
        return SUBJECT_CATEGORIES.map((cat) => {
          if (cat.id !== "etc") return cat;
          const customNames = customFolders.map((f) => f.name);
          return {
            ...cat,
            subSubjects: [...cat.subSubjects, ...customNames]
          };
        });
      }, [SUBJECT_CATEGORIES, customFolders]);

      // 대시보드 통계 및 오늘의 복습 대기열
      const dashboardStats = useMemo(() => {
        return window.META_KILLER_STORE.computeDashboardStats(problems);
      }, [problems]);

      const todayReviewQueue = useMemo(() => {
        return window.META_KILLER_STORE.getTodayReviewQueue(problems);
      }, [problems]);

      // 필터링된 오답 목록
      const filteredProblems = useMemo(() => {
        return problems.filter((p) => {
          if (selectedCategoryId !== "all" && p.categoryId !== selectedCategoryId) return false;
          if (selectedSubSubject !== "all" && p.subSubject !== selectedSubSubject) return false;
          if (selectedErrorTagFilter !== "all" && !(p.errorTags || []).includes(selectedErrorTagFilter)) return false;
          if (searchQuery.trim() !== "") {
            const q = searchQuery.toLowerCase();
            const matchUnit = (p.unitTitle || "").toLowerCase().includes(q);
            const matchQuestion = (p.originalQuestion || "").toLowerCase().includes(q);
            const matchTrap = (p.trapMemo || "").toLowerCase().includes(q);
            const matchSub = (p.subSubject || "").toLowerCase().includes(q);
            if (!matchUnit && !matchQuestion && !matchTrap && !matchSub) return false;
          }
          return true;
        });
      }, [problems, selectedCategoryId, selectedSubSubject, selectedErrorTagFilter, searchQuery]);

      // 현재 상세 모달 대상 문제
      const detailProblem = useMemo(() => {
        return problems.find((p) => p.id === detailProblemId) || null;
      }, [problems, detailProblemId]);

      // 현재 블라인드 퀴즈 대상 문제 및 변형 문항
      const quizProblem = useMemo(() => {
        return problems.find((p) => p.id === quizProblemId) || problems[0] || null;
      }, [problems, quizProblemId]);

      const quizVariant = useMemo(() => {
        if (!quizProblem) return null;
        const vars = quizProblem.variants || [];
        return vars.find((v) => v.id === quizVariantId) || vars[0] || null;
      }, [quizProblem, quizVariantId]);

      // ---------------------------------------------------------
      // 액션 핸들러: 커스텀 과목 폴더 생성 · 수정 · 삭제
      // ---------------------------------------------------------
      function handleAddCustomFolder(e) {
        if (e) e.preventDefault();
        const trimmed = newFolderName.trim();
        if (!trimmed) {
          showToast("생성할 커스텀 과목 폴더 이름을 입력해 주세요.");
          return;
        }
        const etcCat = categoriesWithCustom.find((c) => c.id === "etc");
        if (etcCat && etcCat.subSubjects.includes(trimmed)) {
          showToast("이미 존재하는 과목/폴더 이름입니다.");
          return;
        }
        const newFolder = {
          id: "custom-" + Date.now(),
          name: trimmed,
          description: newFolderDesc.trim() || "사용자 정의 커스텀 오답 폴더",
          createdAt: new Date().toISOString().slice(0, 10)
        };
        setCustomFolders((prev) => [...prev, newFolder]);
        setNewFolderName("");
        setNewFolderDesc("");
        setSelectedCategoryId("etc");
        setSelectedSubSubject(trimmed);
        showToast(`'${trimmed}' 커스텀 과목 폴더가 생성되었습니다!`);
      }

      function handleSaveFolderEdit(folderId) {
        const trimmed = editingFolderName.trim();
        if (!trimmed) return;
        const oldFolder = customFolders.find((f) => f.id === folderId);
        if (!oldFolder) return;

        setCustomFolders((prev) =>
          prev.map((f) => (f.id === folderId ? { ...f, name: trimmed } : f))
        );
        // 해당 폴더에 속해 있던 오답 노트의 subSubject 이름도 동기화
        setProblems((prev) =>
          prev.map((p) =>
            p.categoryId === "etc" && p.subSubject === oldFolder.name
              ? { ...p, subSubject: trimmed }
              : p
          )
        );
        if (selectedSubSubject === oldFolder.name) {
          setSelectedSubSubject(trimmed);
        }
        setEditingFolderId(null);
        setEditingFolderName("");
        showToast(`폴더 이름이 '${trimmed}'(으)로 변경되었습니다.`);
      }

      function handleDeleteCustomFolder(folderId) {
        const target = customFolders.find((f) => f.id === folderId);
        if (!target) return;
        setCustomFolders((prev) => prev.filter((f) => f.id !== folderId));
        if (selectedSubSubject === target.name) {
          setSelectedSubSubject("all");
        }
        showToast(`'${target.name}' 폴더가 삭제되었습니다.`);
      }

      // ---------------------------------------------------------
      // 액션 핸들러: Step 4 블라인드 재도전 시작 및 제출
      // ---------------------------------------------------------
      function startBlindQuiz(problem, preferredVariantId = null) {
        if (!problem) return;
        const vars = problem.variants || [];
        if (vars.length === 0) {
          showToast("먼저 쌍둥이 변형 문제를 생성해 주세요!");
          setDetailProblemId(problem.id);
          return;
        }
        const targetVar =
          vars.find((v) => v.id === preferredVariantId) ||
          vars.find((v) => v.solvedStatus !== "correct") ||
          vars[0];

        setQuizProblemId(problem.id);
        setQuizVariantId(targetVar.id);
        setQuizUserAnswer("");
        setQuizSubmitted(false);
        setQuizResult(null);
        setQuizShowTrapHint(false);
        setQuizElapsedSec(0);
        setDetailProblemId(null);
        setActiveView("blindQuiz");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function handleSubmitBlindQuiz(e) {
        if (e) e.preventDefault();
        if (!quizProblem || !quizVariant) return;
        if (!quizUserAnswer.trim()) {
          showToast("먼저 선지를 선택하거나 정답을 입력해 주세요!");
          return;
        }

        const evaluation = window.META_KILLER_STORE.evaluateBlindRetry(
          quizProblem,
          quizVariant.id,
          quizUserAnswer
        );

        setProblems((prev) =>
          prev.map((p) => (p.id === quizProblem.id ? evaluation.updatedProblem : p))
        );
        setQuizSubmitted(true);
        setQuizResult(evaluation);

        if (evaluation.isCorrect) {
          showToast(`정답입니다! 🎉 에빙하우스 복습 단계가 [${evaluation.previousStage} → ${evaluation.nextStage}]로 승급되었습니다!`);
        } else {
          showToast("아쉽게 오답입니다. 원본 문제와 무엇이 달라졌는지 비교 해설을 확인하세요!");
        }
      }

      // ---------------------------------------------------------
      // 액션 핸들러: 기존 오답에서 AI 쌍둥이 변형 문제 추가 생성
      // ---------------------------------------------------------
      async function handleGenerateVariantForExisting(problem, difficulty) {
        if (!problem || isGeneratingVariant) return;
        setIsGeneratingVariant(true);
        try {
          const newVariant = await window.META_KILLER_ENGINE.generateVariant(
            problem,
            difficulty,
            settings.geminiApiKey
          );
          setProblems((prev) =>
            prev.map((p) =>
              p.id === problem.id
                ? { ...p, variants: [...(p.variants || []), newVariant] }
                : p
            )
          );
          showToast(`[${newVariant.title}] 쌍둥이 변형 문제가 생성되었습니다!`);
        } finally {
          setIsGeneratingVariant(false);
        }
      }

      // ---------------------------------------------------------
      // 액션 핸들러: Step 1~3 위저드에서 이미지 업로드 & 변형 생성 & 오답 저장
      // ---------------------------------------------------------
      function handleImageUpload(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setFormImageDataUrl(ev.target.result);
          showToast("문제 이미지가 첨부되었습니다.");
        };
        reader.readAsDataURL(file);
      }

      function insertLatexSnippet(snippetText) {
        setFormOriginalQuestion((prev) => prev + (prev ? " " : "") + snippetText);
      }

      function toggleFormErrorTag(tagId) {
        setFormErrorTags((prev) =>
          prev.includes(tagId) ? prev.filter((id) => id !== tagId) : [...prev, tagId]
        );
      }

      async function handleWizardGenerateVariant() {
        if (!formOriginalQuestion.trim()) {
          showToast("Step 1에서 원본 문제 텍스트를 먼저 입력해 주세요.");
          setWizardStep(1);
          return;
        }
        setIsGeneratingVariant(true);
        try {
          const tempProblem = {
            categoryId: formCategory,
            subSubject: formSubSubject,
            unitTitle: formUnitTitle || `${formSubSubject} 킬러 분석 문항`,
            originalQuestion: formOriginalQuestion,
            originalChoices: formChoices,
            myWrongAnswer: formMyWrongAnswer,
            actualAnswer: formActualAnswer,
            originalExplanation: formOriginalExplanation,
            errorTags: formErrorTags,
            trapMemo: formTrapMemo,
            variants: formGeneratedVariants
          };
          const generated = await window.META_KILLER_ENGINE.generateVariant(
            tempProblem,
            formDifficulty,
            settings.geminiApiKey
          );
          setFormGeneratedVariants((prev) => [...prev, generated]);
          showToast("맞춤형 쌍둥이 변형 문제가 생성되었습니다!");
        } finally {
          setIsGeneratingVariant(false);
        }
      }

      async function handleSaveNewProblem(andStartQuiz = false) {
        if (!formOriginalQuestion.trim()) {
          showToast("원본 문제 본문을 입력해 주세요.");
          setWizardStep(1);
          return;
        }

        let variantsToSave = [...formGeneratedVariants];
        if (variantsToSave.length === 0) {
          const tempProblem = {
            categoryId: formCategory,
            subSubject: formSubSubject,
            unitTitle: formUnitTitle || `${formSubSubject} 고난도 핵심 문항`,
            originalQuestion: formOriginalQuestion,
            originalChoices: formChoices,
            myWrongAnswer: formMyWrongAnswer,
            actualAnswer: formActualAnswer,
            originalExplanation: formOriginalExplanation,
            errorTags: formErrorTags.length > 0 ? formErrorTags : ["condition_miss"],
            trapMemo: formTrapMemo || "핵심 단서 조건 및 선지 인과 관계 함정",
            variants: []
          };
          const autoVariant = window.META_KILLER_ENGINE.generateLocalVariant(
            tempProblem,
            formDifficulty
          );
          variantsToSave = [autoVariant];
        }

        const author = currentUser || {
          id: "guest",
          name: "게스트 학습자",
          grade: "고등학생",
          avatar: "👤"
        };

        const newProblem = {
          id: "prob-" + Date.now(),
          categoryId: formCategory,
          subSubject: formSubSubject,
          unitTitle: formUnitTitle.trim() || `${formSubSubject} 고난도 오답 분석`,
          createdAt: new Date().toISOString().slice(0, 10),
          questionType: formQuestionType,
          originalQuestion: formOriginalQuestion,
          originalChoices: formQuestionType === "multiple" ? formChoices : [],
          myWrongAnswer: formMyWrongAnswer,
          actualAnswer: formActualAnswer,
          originalExplanation: formOriginalExplanation || "출제 원리 및 핵심 조건 분석 해설",
          imageDataUrl: formImageDataUrl,
          errorTags: formErrorTags.length > 0 ? formErrorTags : ["condition_miss"],
          trapMemo:
            formTrapMemo.trim() ||
            "내가 출제자라면 조건의 경계값과 매력적인 오답 선지에 함정을 설계했을 것이다.",
          ebbinghausStage: "D+1",
          dueToday: true,
          lastReviewedAt: new Date().toISOString().slice(0, 10),
          reviewCount: 0,
          masteredCount: 0,
          variants: variantsToSave,
          authorId: author.id,
          authorName: author.name,
          authorGrade: author.grade,
          authorAvatar: author.avatar,
          likesCount: 0,
          likedUsers: [],
          bookmarkUsers: []
        };

        setProblems((prev) => [newProblem, ...prev]);

        // 폼 초기화
        setFormUnitTitle("");
        setFormOriginalQuestion("");
        setFormOriginalExplanation("");
        setFormImageDataUrl("");
        setFormTrapMemo("");
        setFormGeneratedVariants([]);
        setWizardStep(1);

        if (andStartQuiz) {
          startBlindQuiz(newProblem, variantsToSave[0].id);
          showToast("오답 노트가 등록되었으며 즉시 Step 4 블라인드 재도전을 시작합니다!");
        } else {
          setActiveView("dashboard");
          showToast("새 오답 노트와 쌍둥이 변형 문제가 D+1 복습 대기열에 등록되었습니다!");
        }
      }

      // 에빙하우스 복습 알림 시뮬레이션 핸들러
      function handleSimulateSchedule(stage) {
        setProblems((prev) => window.META_KILLER_STORE.triggerReviewSimulation(prev, stage));
        showToast(
          stage === "ALL"
            ? "모든 미체화 문항(D+1, D+3, D+7)의 오늘 복습 알림이 활성화되었습니다!"
            : `${stage} 복습 주기가 도래하여 오늘의 재도전 대기열에 추가되었습니다!`
        );
      }

      function formatSeconds(sec) {
        const m = String(Math.floor(sec / 60)).padStart(2, "0");
        const s = String(sec % 60).padStart(2, "0");
        return `${m}:${s}`;
      }

      // ---------------------------------------------------------
      // 사용자 인증(로그인, 회원가입, 로그아웃) 및 커뮤니티 액션 핸들러
      // ---------------------------------------------------------
      function handleLogin(e, customId = null, customPw = null) {
        if (e) e.preventDefault();
        const uname = customId || authId;
        const upw = customPw || authPw;
        const res = window.META_KILLER_STORE.login(uname, upw);
        if (res.success) {
          setCurrentUser(res.user);
          setShowAuthModal(false);
          setAuthId("");
          setAuthPw("");
          showToast(`환영합니다, ${res.user.name}님! 로그인되었습니다.`);
        } else {
          showToast(res.message);
        }
      }

      function handleSignup(e) {
        if (e) e.preventDefault();
        if (!authId.trim() || !authPw.trim()) {
          showToast("아이디와 비밀번호를 모두 입력해 주세요.");
          return;
        }
        const res = window.META_KILLER_STORE.signup({
          username: authId,
          password: authPw,
          name: signupName || authId,
          grade: signupGrade,
          avatar: signupAvatar
        });
        if (res.success) {
          setUsers(window.META_KILLER_STORE.loadUsers());
          setCurrentUser(res.user);
          setShowAuthModal(false);
          setAuthId("");
          setAuthPw("");
          setSignupName("");
          showToast(`회원가입이 완료되었습니다! 환영합니다, ${res.user.name}님.`);
        } else {
          showToast(res.message);
        }
      }

      function handleLogout() {
        window.META_KILLER_STORE.logout();
        setCurrentUser(null);
        setShowUserProfileModal(false);
        setShowDeleteAccountConfirm(false);
        showToast("로그아웃되었습니다. 게스트 모드로 둘러보실 수 있습니다.");
      }

      function handleDeleteAccount(targetUserId, deleteData = true) {
        const res = window.META_KILLER_STORE.deleteAccount(targetUserId, deleteData);
        if (res.success) {
          setUsers(res.users);
          setCurrentUser(res.currentUser);
          if (deleteData) {
            setProblems(res.problems);
            setSchedules((prev) => prev.filter((s) => s.authorId !== targetUserId));
          }
          setShowDeleteAccountConfirm(false);
          setShowUserProfileModal(false);
          showToast(`'${res.deletedUser.name}' 계정이 삭제되었습니다.`);
        } else {
          showToast(res.message);
        }
      }

      // ---------------------------------------------------------

        {
          id: "exam",
          label: "🔥 시험/모의고사",
          badge: "bg-rose-500/20 text-rose-300 border-rose-500/40",
          dot: "bg-rose-400"
        },
        {
          id: "study",
          label: "📘 학습/복습",
          badge: "bg-indigo-500/20 text-indigo-300 border-indigo-500/40",
          dot: "bg-indigo-400"
        },
        {
          id: "assignment",
          label: "📝 수행평가/과제",
          badge: "bg-amber-500/20 text-amber-300 border-amber-500/40",
          dot: "bg-amber-400"
        },
        {
          id: "personal",
          label: "🌱 기타 일정",
          badge: "bg-emerald-500/20 text-emerald-300 border-emerald-500/40",

      function handlePrevMonth() {
        if (calendarMonth === 0) {
          setCalendarYear((y) => y - 1);
          setCalendarMonth(11);
        } else {
          setCalendarMonth((m) => m - 1);
        }
      }

      function handleNextMonth() {
        if (calendarMonth === 11) {
          setCalendarYear((y) => y + 1);
          setCalendarMonth(0);
        } else {
          setCalendarMonth((m) => m + 1);
        }
      }

      function handleGoToday() {
        const now = new Date();
        setCalendarYear(now.getFullYear());
        setCalendarMonth(now.getMonth());
        setSelectedDate(getLocalTodayStr());
      }

      function handleSaveSchedule(e) {
        if (e) e.preventDefault();
        const trimmed = scheduleTitle.trim();
        if (!trimmed) {
          showToast("일정 제목을 입력해 주세요.");
          return;
        }
        if (editingScheduleId) {
          setSchedules((prev) =>
            prev.map((s) =>
              s.id === editingScheduleId
                ? {
                    ...s,
                    date: selectedDate,
                    title: trimmed,
                    time: scheduleTime.trim(),
                    category: scheduleCategory,
                    memo: scheduleMemo.trim()
                  }
                : s
            )
          );
          setEditingScheduleId(null);
          showToast("일정이 수정되었습니다.");
        } else {
          const newItem = {
            id: "sched-" + Date.now(),
            date: selectedDate,
            title: trimmed,
            time: scheduleTime.trim(),
            category: scheduleCategory,
            memo: scheduleMemo.trim(),
            completed: false,
            authorId: currentUser ? currentUser.id : "guest",
            createdAt: getLocalTodayStr()
          };
          setSchedules((prev) => [...prev, newItem]);
          showToast(`[${selectedDate}] 일정이 등록되었습니다!`);
        }
        setScheduleTitle("");
        setScheduleTime("");
        setScheduleMemo("");
      }

      function handleToggleScheduleComplete(id) {
        setSchedules((prev) =>
          prev.map((s) => (s.id === id ? { ...s, completed: !s.completed } : s))
        );
      }

      function handleStartEditSchedule(item) {
        setSelectedDate(item.date);
        const parts = (item.date || "").split("-");
        if (parts.length === 3) {
          setCalendarYear(parseInt(parts[0], 10));
          setCalendarMonth(parseInt(parts[1], 10) - 1);
        }
        setEditingScheduleId(item.id);
        setScheduleTitle(item.title || "");
        setScheduleTime(item.time || "");
        setScheduleCategory(item.category || "study");
        setScheduleMemo(item.memo || "");
      }

      function handleDeleteSchedule(id) {
        setSchedules((prev) => prev.filter((s) => s.id !== id));
        if (editingScheduleId === id) {
          setEditingScheduleId(null);
          setScheduleTitle("");
          setScheduleTime("");
          setScheduleMemo("");
        }
        showToast("일정이 삭제되었습니다.");
      }

      function renderCalendarSection() {
        const todayStr = getLocalTodayStr();
        const firstDayOfWeek = new Date(calendarYear, calendarMonth, 1).getDay();
        const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();

        const cells = [];
        for (let i = 0; i < firstDayOfWeek; i++) {
          cells.push(null);
        }
        for (let d = 1; d <= daysInMonth; d++) {
          cells.push(d);
        }

        const selectedDateSchedules = schedules.filter((s) => s.date === selectedDate);
        const selectedDateProblems = problems.filter((p) => p.createdAt === selectedDate);
        const sortedAllSchedules = [...schedules].sort((a, b) => (a.date || "").localeCompare(b.date || ""));

        return (
          <section
            className={`rounded-2xl p-5 sm:p-6 border space-y-5 ${
              settings.darkMode ? "study-card-dark" : "study-card-light"
            }`}
          >

            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800/70 pb-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-lg">
                  📅
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h2 className="text-base sm:text-lg font-extrabold">
                      학습 달력 & 일정 플래너
                    </h2>
                    <span className="px-2 py-0.5 text-[11px] font-bold rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">

                    </span>
                  </div>
                  <p className="text-xs text-slate-400">

                  </p>
                </div>

              {/* 월 이동 컨트롤 */}

                                type="button"
                                title="이 계정 삭제"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  handleDeleteAccount(u.id, true);
                                }}
                                className="absolute top-1 right-1 w-5 h-5 rounded-full bg-rose-500/20 hover:bg-rose-600 text-rose-300 hover:text-white text-[10px] flex items-center justify-center transition"
                              >
                                ✕
                              </button>
                              <button
                                type="button"
                                onClick={(e) => handleLogin(e, u.username, u.password)}
                                className="w-full text-center"
                              >
                                <span className="text-xl block">{u.avatar}</span>
                                <span className="text-xs font-bold text-slate-200 block mt-0.5 truncate">
                                  {u.name}
                                </span>
                                <span className="text-[10px] text-slate-400 block truncate">
                                  {u.grade}
                                </span>
                              </button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <form onSubmit={handleLogin} className="space-y-3">
                      <div>
                        <label className="block text-xs font-bold mb-1 text-slate-300">아이디</label>
                        <input
                          type="text"
                          value={authId}
                          onChange={(e) => setAuthId(e.target.value)}
                          placeholder="아이디 입력"
                          className={`w-full px-3 py-2 rounded-xl text-xs border ${
                            settings.darkMode
                              ? "bg-night-800 border-slate-700 text-white"
                              : "bg-white border-slate-300 text-slate-900"
                          }`}
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold mb-1 text-slate-300">비밀번호</label>
                        <input
                          type="password"
                          value={authPw}
                          onChange={(e) => setAuthPw(e.target.value)}
                          placeholder="비밀번호 입력"
                          className={`w-full px-3 py-2 rounded-xl text-xs border ${
                            settings.darkMode
                              ? "bg-night-800 border-slate-700 text-white"
                              : "bg-white border-slate-300 text-slate-900"
                          }`}
                        />
                      </div>
                      <button
                        type="submit"
                        className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-md"
                      >
                        로그인
                      </button>
                    </form>
                  </div>
                ) : (
                  <form onSubmit={handleSignup} className="space-y-3 text-xs">
                    <div>
                      <label className="block font-bold mb-1 text-slate-300">아이디</label>
                      <input
                        type="text"
                        value={authId}
                        onChange={(e) => setAuthId(e.target.value)}
                        placeholder="영문/숫자 아이디"
                        className={`w-full px-3 py-2 rounded-xl border ${
                          settings.darkMode
                            ? "bg-night-800 border-slate-700 text-white"
                            : "bg-white border-slate-300 text-slate-900"
                        }`}
                      />
                    </div>
                    <div>
                      <label className="block font-bold mb-1 text-slate-300">비밀번호</label>
                      <input
                        type="password"
                        value={authPw}
                        onChange={(e) => setAuthPw(e.target.value)}
                        placeholder="비밀번호"
                        className={`w-full px-3 py-2 rounded-xl border ${
                          settings.darkMode
                            ? "bg-night-800 border-slate-700 text-white"
                            : "bg-white border-slate-300 text-slate-900"
                        }`}
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block font-bold mb-1 text-slate-300">성명 / 닉네임</label>
                        <input
                          type="text"
                          value={signupName}
                          onChange={(e) => setSignupName(e.target.value)}
                          placeholder="예: 홍길동"
                          className={`w-full px-3 py-2 rounded-xl border ${
                            settings.darkMode
                              ? "bg-night-800 border-slate-700 text-white"
                              : "bg-white border-slate-300 text-slate-900"
                          }`}
                        />
                      </div>
                      <div>
                        <label className="block font-bold mb-1 text-slate-300">학년 / 구분</label>
                        <select
                          value={signupGrade}
                          onChange={(e) => setSignupGrade(e.target.value)}
                          className={`w-full px-3 py-2 rounded-xl border ${
                            settings.darkMode
                              ? "bg-night-800 border-slate-700 text-white"
                              : "bg-white border-slate-300 text-slate-900"
                          }`}
                        >
                          <option value="고3 이과">고3 이과</option>
                          <option value="고3 문과">고3 문과</option>
                          <option value="고2 이과">고2 이과</option>
                          <option value="고2 문과">고2 문과</option>
                          <option value="고1">고1 공통</option>
                          <option value="출제 멘토">출제 멘토/선생님</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block font-bold mb-1 text-slate-300">프로필 아바타</label>
                      <div className="flex gap-2">
                        {["👨‍🎓", "👩‍🎓", "👨‍🏫", "👩‍🏫", "🧑‍🔬", "🎯", "⚡"].map((em) => (
                          <button
                            key={em}
                            type="button"
                            onClick={() => setSignupAvatar(em)}
                            className={`p-2 rounded-lg border text-lg ${
                              signupAvatar === em ? "bg-indigo-600 border-indigo-400" : "bg-slate-800 border-slate-700"
                            }`}
                          >
                            {em}
                          </button>
                        ))}
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-md mt-2"
                    >
                      회원가입 완료 및 자동 로그인
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* =========================================================
              모달 4: 사용자 프로필 & 계정 전환 / 계정 삭제 모달
             ========================================================= */}
          {showUserProfileModal && currentUser && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div
                className={`max-w-md w-full rounded-2xl p-6 border space-y-4 ${
                  settings.darkMode ? "bg-night-900 border-slate-700" : "bg-white border-slate-200"
                }`}
              >
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-base font-extrabold flex items-center gap-2">
                    <span>👤</span>
                    <span>내 학습 프로필 & 계정 관리</span>
                  </h3>
                  <button
                    onClick={() => setShowUserProfileModal(false)}
                    className="text-xs text-slate-400 hover:text-white"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex items-center gap-3 p-4 rounded-xl bg-indigo-500/10 border border-indigo-500/30">
                  <span className="text-4xl">{currentUser.avatar || "👨‍🎓"}</span>
                  <div>
                    <div className="flex items-center gap-2">
                      <h4 className="text-base font-black">{currentUser.name}</h4>
                      <span className="text-xs font-semibold px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300">
                        {currentUser.grade}
                      </span>
                    </div>
                    <p className="text-xs text-slate-400 mt-0.5">아이디: @{currentUser.username}</p>
                    <p className="text-xs text-amber-300 mt-1">"{currentUser.bio}"</p>
                  </div>
                </div>

                {/* 내 통계 요약 */}
                <div className="grid grid-cols-3 gap-2 text-center text-xs">
                  <div className="p-3 rounded-xl bg-slate-800/80 border border-slate-700">
                    <span className="text-slate-400 block mb-0.5">내가 올린 문제</span>
                    <strong className="text-base text-indigo-400 font-extrabold">
                      {problems.filter((p) => p.authorId === currentUser.id).length}건
                    </strong>
                  </div>
                  <div className="p-3 rounded-xl bg-slate-800/80 border border-slate-700">
                    <span className="text-slate-400 block mb-0.5">획득한 좋아요</span>
                    <strong className="text-base text-rose-400 font-extrabold">
                      {problems
                        .filter((p) => p.authorId === currentUser.id)
                        .reduce((acc, p) => acc + (p.likesCount || 0), 0)}개
                    </strong>
                  </div>
                  <div className="p-3 rounded-xl bg-slate-800/80 border border-slate-700">
                    <span className="text-slate-400 block mb-0.5">보관함 북마크</span>
                    <strong className="text-base text-amber-400 font-extrabold">
                      {problems.filter((p) => (p.bookmarkUsers || []).includes(currentUser.id)).length}개
                    </strong>
                  </div>
                </div>

                {/* 빠른 다른 계정 전환 */}
                {users.filter((u) => u.id !== currentUser.id).length > 0 && (
                  <div className="pt-2 border-t border-slate-800 space-y-2">
                    <span className="text-xs font-bold text-slate-300 block">다른 계정으로 즉시 전환:</span>
                    <div className="flex flex-wrap gap-2">
                      {users
                        .filter((u) => u.id !== currentUser.id)
                        .map((u) => (
                          <button
                            key={u.id}
                            onClick={(e) => {
                              handleLogin(e, u.username, u.password);
                              setShowUserProfileModal(false);
                            }}
                            className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold flex items-center gap-1.5"
                          >
                            <span>{u.avatar}</span>
                            <span>{u.name} ({u.grade})</span>
                          </button>
                        ))}
                    </div>
                  </div>
                )}

                {/* 계정 삭제 (회원 탈퇴) 영역 */}
                <div className="pt-2 border-t border-slate-800">
                  {!showDeleteAccountConfirm ? (
                    <div className="flex items-center justify-between">
                      <span className="text-xs text-slate-400">계정을 영구적으로 삭제하시겠습니까?</span>
                      <button
                        type="button"
                        onClick={() => setShowDeleteAccountConfirm(true)}
                        className="px-3 py-1.5 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 border border-rose-500/30 text-xs font-bold transition"
                      >
                        🗑️ 계정 삭제 (탈퇴)
                      </button>
                    </div>
                  ) : (
                    <div className="p-3.5 rounded-xl bg-rose-950/40 border border-rose-500/50 space-y-3 animate-slide-up">
                      <div className="text-xs font-bold text-rose-300">
                        ⚠️ 정말로 '{currentUser.name} (@{currentUser.username})' 계정을 삭제하시겠습니까?
                      </div>
                      <label className="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={deleteAccountWithData}
                          onChange={(e) => setDeleteAccountWithData(e.target.checked)}
                          className="w-4 h-4 accent-rose-500 rounded"
                        />
                        <span>이 계정으로 등록한 오답 문제와 달력 일정도 함께 삭제</span>
                      </label>
                      <div className="flex justify-end gap-2">
                        <button
                          type="button"
                          onClick={() => setShowDeleteAccountConfirm(false)}
                          className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-semibold"
                        >
                          취소
                        </button>
                        <button
                          type="button"
                          onClick={() => handleDeleteAccount(currentUser.id, deleteAccountWithData)}
                          className="px-3.5 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-extrabold shadow"
                        >
                          영구 계정 삭제 확인
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                <div className="pt-2 border-t border-slate-800 flex items-center justify-between">
                  <button
                    onClick={handleLogout}
                    className="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 border border-slate-700 text-xs font-bold hover:bg-slate-700"
                  >
                    로그아웃
                  </button>
                  <button
                    onClick={() => setShowUserProfileModal(false)}
                    className="px-4 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold"
                  >
                    확인
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 하단 푸터 */}
          <footer className="mt-12 py-6 border-t border-slate-800/60 text-center text-xs text-slate-500">
            META-KILLER · 2022 개정 교육과정 고등학생을 위한 메타인지 오답 노트 & 에빙하우스 킬러 변형 퀴즈 플랫폼
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
